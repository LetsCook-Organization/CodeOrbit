# Dependabot: weekly pull requests for GitHub Actions, monthly for the npm dev tools.
# No custom labels: Dependabot then adds its own "dependencies" label (and creates
# it if missing). Custom labels that do not exist in the repo are silently skipped.
version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    commit-message:
      prefix: 'chore(ci)'
      include: 'scope'
    open-pull-requests-limit: 5

  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'monthly'
    commit-message:
      prefix: 'chore(deps)'
    open-pull-requests-limit: 3
    groups:
      dev-tools:
        patterns:
          - '*'
